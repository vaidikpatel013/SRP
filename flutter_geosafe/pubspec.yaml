name: geosafe
description: "GeoSafe: Urban Safety Analytics & Real-Time Emergency Response System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.3
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  geolocator: ^10.1.0
  provider: ^6.1.1
  audioplayers: ^5.2.1
  vibration: ^1.8.4
  http: ^1.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/safety_zones.json
